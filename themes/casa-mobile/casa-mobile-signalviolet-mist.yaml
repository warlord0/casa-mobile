Casa Mobile Signalviolet Mist:

  # Fonts
  primary-font-family: 'sans-serif'
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-common-code_-_font-family: "var(--primary-font-family)"
  paper-font-body1_-_font-family: "var(--primary-font-family)"
  paper-font-subhead_-_font-family: "var(--primary-font-family)"
  paper-font-headline_-_font-family: "var(--primary-font-family)"
  paper-font-caption_-_font-family: "var(--primary-font-family)"
  paper-font-title_-_font-family: "var(--primary-font-family)"
  ha-card-header-font-family: "var(--primary-font-family)"

  # Text
  text-color: '#f2f5f6'
  primary-text-color: 'var(--text-color)'
  text-primary-color: 'var(--text-color)'
  sidebar-text-color: 'var(--text-color)'
  secondary-text-color: '#b2afbd'
  text-medium-light-color: '#868098'
  text-medium-color: '#6d6581'
  disabled-text-color: '#574d6e'
  primary-color: '#F0F2F5'

  # Text Fields an Dropdown
  mdc-text-field-fill-color: 'var(--background-color)'
  mdc-text-field-ink-color: 'var(--text-color)'
  mdc-select-fill-color: 'var(--background-color)'
  mdc-text-field-label-ink-color: 'var(--secondary-text-color)'
  ha-color-form-background: "rgba(255, 255, 255, 0.06)"
  ha-color-form-background-hover: "rgba(255, 255, 255, 0.10)"
  ha-color-form-background-disabled: "rgba(255, 255, 255, 0.03)"
  ha-color-form-ink-color: "var(--text-color)"
  input-fill-color: 'var(--background-color)'
  input-ink-color: 'var(--text-color)'
  input-label-ink-color: 'var(--text-color)'
  input-disabled-fill-color: 'var(--background-color)'
  input-disabled-ink-color: 'var(--disabled-text-color)'
  input-disabled-label-ink-color: 'var(--disabled-text-color)'
  input-idle-line-color: 'var(--background-color)'
  input-dropdown-icon-color: 'var(--secondary-text-color)'
  input-hover-line-color: 'var(--primary-color)'
  code-editor-background-color: '#1b0c39'
  codemirror-property: 'var(--accent-color)'
  
  # Main Colors
  app-header-background-color: '#14082b'
  header-height: 48px
  accent-color: '#F0F2F5'
  accent-medium-color: 'var(--accent-color)'
  ha-color-text-primary-inverted: '#14082b'
  ha-color-text-primary: '#f2f5f6'
  ha-color-text-disabled: '#716985'
  ha-color-on-disabled-loud: '#6d6581'
  ha-color-on-disabled-normal: '#6d6581'
  ha-color-on-disabled-quiet: '#6d6581'
  ha-color-fill-disabled-loud-hover: '#3d3157'
  ha-color-fill-disabled-loud-resting: '#352850'
  ha-color-fill-disabled-normal-hover: '#30234c'
  ha-color-fill-disabled-normal-resting: '#2a1c46'
  ha-color-fill-disabled-quiet-hover: '#2a1c46'
  ha-color-fill-disabled-quiet-resting: '#241541'
  ha-color-border-neutral-loud: '#716985'
  ha-color-border-neutral-normal: '#463b5f'
  ha-color-border-neutral-quiet: '#30234c'
  ha-color-on-neutral-loud: '#f2f5f6'
  ha-color-on-neutral-normal: '#c7c6d0'
  ha-color-on-neutral-quiet: '#a7a3b4'
  ha-color-fill-neutral-loud-active: '#4f4466'
  ha-color-fill-neutral-loud-hover: '#6d6581'
  ha-color-fill-neutral-loud-resting: '#5c5272'
  ha-color-fill-neutral-normal-active: '#3d3157'
  ha-color-fill-neutral-normal-hover: '#352850'
  ha-color-fill-neutral-normal-resting: '#2c1f48'
  ha-color-fill-neutral-quiet-active: '#352850'
  ha-color-fill-neutral-quiet-hover: '#2c1f48'
  ha-color-fill-neutral-quiet-resting: '#241541'
  ha-color-text-link: '#F0F2F5'
  ha-color-border-primary-loud: '#F0F2F5'
  ha-color-border-primary-normal: '#908aa0'
  ha-color-border-primary-quiet: '#665c7b'
  ha-color-on-primary-quiet: '#F0F2F5'
  ha-color-on-primary-normal: '#f3f5f7'
  ha-color-on-primary-loud: '#14082b'
  ha-color-fill-primary-loud-active: '#d3d5d8'
  ha-color-fill-primary-loud-hover: '#f2f4f6'
  ha-color-fill-primary-loud-resting: '#F0F2F5'
  ha-color-fill-primary-normal-active: '#6c6380'
  ha-color-fill-primary-normal-hover: '#5b5171'
  ha-color-fill-primary-normal-resting: '#4a3f62'
  ha-color-fill-primary-quiet-active: '#574c6e'
  ha-color-fill-primary-quiet-hover: '#4a3f62'
  ha-color-fill-primary-quiet-resting: '#392c53'
  lovelace-background: "radial-gradient(89% 57% at 39% 68%, rgba(240,242,245,0.14), transparent 70%), radial-gradient(78% 52% at 58% 65%, rgba(240,242,245,0.11), transparent 70%), radial-gradient(79% 42% at 8% 88%, rgba(64,55,83,0.54), transparent 70%), radial-gradient(70% 40% at 11% 67%, rgba(64,55,83,0.54), transparent 70%), linear-gradient(180deg, #14082b 0%, #080311 100%) fixed"
  rgb-primary-color: '240, 242, 245'
  state-active-color: '#F0F2F5'
  state-inactive-color: '#665e7b'
  state-icon-color: '#9f9bae'

  # Background
  background-color: '#14082b'
  primary-background-color: 'var(--background-color)'
  background-color-2: '#392d53'
  secondary-background-color: 'none'
  markdown-code-background-color: 'var(--background-color)'
  
  # Card
  card-background-color: '#1b0c39'
  ha-card-background: "url(data:image/svg+xml;base64,), linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 55%), #1b0c39"
  ha-card-box-shadow: 'inset 0 1px 0 rgba(255,255,255,0.06)'
  ha-card-border-radius: '14px'
  bubble-border-radius: '14px'
  ha-card-border-style: 'solid'
  ha-card-border-width: '1px'
  ha-card-border-color: 'rgba(255,255,255,0.09)'
  border-color: 'none'
  grid-card-gap: '14px'
  border-style: 'none !important'

  # Icons
  paper-item-icon-color: 'var(--text-color)'
  paper-item-icon-active-color: 'var(--accent-color)'
  
  # Sidebar
  sidebar-background-color: 'var(--background-color)'
  sidebar-icon-color: '#918ca1'
  sidebar-selected-icon-color: 'var(--accent-color)'
  sidebar-selected-text-color: 'var(--text-color)'
  paper-listbox-background-color: 'var(--sidebar-background-color)'
  divider-color: 'rgba(255,255,255,0.09)'
  light-primary-color: '#1b0c39'

  # Sliders
  paper-slider-knob-color: 'var(--accent-color)'
  paper-slider-pin-color: 'var(--background-color-2)'
  paper-slider-active-color: 'var(--accent-color)'
  paper-slider-container-color: 'var(--background-color-2)'

  # Toggle:
  paper-toggle-button-checked-bar-color: 'var(--accent-color)'
  mdc-theme-primary: 'var(--accent-color)'

  # Switch
  switch-unchecked-color: '#868098'
  switch-checked-button-color: 'var(--accent-color)'
  switch-unchecked-track-color: 'var(--background-color-2)'
  switch-checked-track-color: 'var(--background-color-2)'

  # Radio Button
  paper-radio-button-checked-color: 'var(--accent-color)'

  # Popups
  more-info-header-background: 'var(--secondary-background-color)'
  paper-dialog-background-color: '#261842'

  # Tables
  table-row-background-color: 'var(--background-color)'
  table-row-alternative-background-color: '#1b0c39'

  # Badges
  label-badge-background-color: 'var(--background-color)'
  label-badge-text-color: 'var(--text-primary-color)'
  label-badge-red: 'rgba(73,85,108,1)'
  label-badge-blue: 'rgba(26,137,245,1)'
  label-badge-green: 'rgba(0,202,139,1)'
  label-badge-yellow: 'rgba(222,176,107,1)'

  paper-input-container-focus-color: 'var(--accent-color)'
  


  # Alarm
  alarm-color-armed: 'rgba(247,53,67,1)'
